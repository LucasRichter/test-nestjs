services:
  mongo:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-healthcheck.js:/mongo-healthcheck.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--file', '/mongo-healthcheck.js']
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/ingest?replicaSet=rs0
      PORT: 3000
      PROCESSING_DELAY_MS: 5000
      REORDER_GRACE_MS: 2000
      WORKER_CONCURRENCY: 100
      LOCK_TTL_MS: 30000
      MAX_ATTEMPTS: 5
      POLL_INTERVAL_MS: 200
      WORKER_ENABLED: 'true'
      RETRY_BACKOFF_MS: 1000
      OLDEST_PENDING_DEGRADED_MS: 30000
      SHUTDOWN_TIMEOUT_MS: 10000
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mongo-data:
